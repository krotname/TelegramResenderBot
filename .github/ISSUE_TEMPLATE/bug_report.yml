name: Bug report
description: Report a reproducible problem with bot behavior.
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and package version.
      placeholder: "Ubuntu 24.04, Python 3.12, aiogram 3.28.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Start bot ...
        3. Send message ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
      validations:
        required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What actually happened?
      validations:
        required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste relevant logs or console output.
      render: shell
